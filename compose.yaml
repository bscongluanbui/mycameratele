name: ezviz-telegram-archive

services:
  archive:
    image: ${ARCHIVE_IMAGE:-ghcr.io/bscongluanbui/mycameratele:latest}
    pull_policy: missing
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      STATE_DIR: /data
      CACHE_DIR: /cache
      INPUT_DIR: /input
      DISPLAY_TIMEZONE: ${DISPLAY_TIMEZONE:-Asia/Ho_Chi_Minh}
      TENANT_ID: ${TENANT_ID:-house01}
      TELEGRAM_DESTINATION: ${TELEGRAM_DESTINATION:-channel}
      TELEGRAM_STORAGE_CHANNEL_ID: ${TELEGRAM_STORAGE_CHANNEL_ID:-}
      MEDIA_MODE: ${MEDIA_MODE:-remux_copy}
      PASSTHROUGH_PROBE_METADATA: ${PASSTHROUGH_PROBE_METADATA:-false}
      CAMERA_HOST: ${CAMERA_HOST:-HOST}
      CAMERA_DEVICE_PORT: ${CAMERA_DEVICE_PORT:-8000}
      CAMERA_RTSP_PORT: ${CAMERA_RTSP_PORT:-554}
      CAMERA_CHANNEL: ${CAMERA_CHANNEL:-1}
      CAMERA_NAME: ${CAMERA_NAME:-front}
      TELEGRAM_OWNER_USER_ID: ${TELEGRAM_OWNER_USER_ID:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_PLAYER_PUBLIC_URL: ${TELEGRAM_PLAYER_PUBLIC_URL:-}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-https://api.telegram.org}
      TELEGRAM_API_MODE: ${TELEGRAM_API_MODE:-cloud}
      BOT_API_SPOOL_DIR: ${BOT_API_SPOOL_DIR:-}
      BOT_API_SPOOL_MAX_GB: ${BOT_API_SPOOL_MAX_GB:-5}
      TELEGRAM_MAX_BYTES: ${TELEGRAM_MAX_BYTES:-50000000}
      ENABLE_UPLOAD: ${ENABLE_UPLOAD:-false}
      KEEP_CACHE: ${KEEP_CACHE:-false}
      CACHE_RETENTION_HOURS: ${CACHE_RETENTION_HOURS:-0}
      ERROR_RETENTION_HOURS: ${ERROR_RETENTION_HOURS:-72}
      SD_SYNC_INTERVAL_SECONDS: ${SD_SYNC_INTERVAL_SECONDS:-900}
      HCNETSDK_DIR: /opt/hcnetsdk
    volumes:
      - archive-state:/data
      - archive-cache:/cache
      # Read only: worker checks admission; Bot API alone owns multipart files.
      - bot-api-spool:/var/lib/telegram-bot-api-spool:ro
      - type: bind
        source: ${INPUT_HOST_DIR:-./input}
        target: /input
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Dashboard and worker share the same image, database and cache volumes.
  dashboard:
    image: ${ARCHIVE_IMAGE:-ghcr.io/bscongluanbui/mycameratele:latest}
    pull_policy: missing
    command: [dashboard, --host, 0.0.0.0, --port, "8080"]
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      STATE_DIR: /data
      CACHE_DIR: /cache
      INPUT_DIR: /input
      DISPLAY_TIMEZONE: ${DISPLAY_TIMEZONE:-Asia/Ho_Chi_Minh}
      TENANT_ID: ${TENANT_ID:-house01}
      TELEGRAM_DESTINATION: ${TELEGRAM_DESTINATION:-channel}
      TELEGRAM_STORAGE_CHANNEL_ID: ${TELEGRAM_STORAGE_CHANNEL_ID:-}
      MEDIA_MODE: ${MEDIA_MODE:-remux_copy}
      PASSTHROUGH_PROBE_METADATA: ${PASSTHROUGH_PROBE_METADATA:-false}
      TELEGRAM_OWNER_USER_ID: ${TELEGRAM_OWNER_USER_ID:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_PLAYER_PUBLIC_URL: ${TELEGRAM_PLAYER_PUBLIC_URL:-}
      TELEGRAM_BOT_API_FILE_ROOT: /var/lib/telegram-bot-api
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-https://api.telegram.org}
      TELEGRAM_API_MODE: ${TELEGRAM_API_MODE:-cloud}
      TELEGRAM_MAX_BYTES: ${TELEGRAM_MAX_BYTES:-50000000}
      ENABLE_UPLOAD: ${ENABLE_UPLOAD:-false}
      KEEP_CACHE: ${KEEP_CACHE:-false}
      CACHE_RETENTION_HOURS: ${CACHE_RETENTION_HOURS:-0}
      ERROR_RETENTION_HOURS: ${ERROR_RETENTION_HOURS:-72}
      SD_SYNC_INTERVAL_SECONDS: ${SD_SYNC_INTERVAL_SECONDS:-900}
      HCNETSDK_DIR: /opt/hcnetsdk
      DASHBOARD_COOKIE_SECURE: ${DASHBOARD_COOKIE_SECURE:-false}
    ports:
      - "${DASHBOARD_BIND_IP:-0.0.0.0}:${DASHBOARD_PORT:-8080}:8080"
    volumes:
      - archive-state:/data
      - archive-cache:/cache
      # Local getFile returns a server path. The player only reads this volume.
      - bot-api-state:/var/lib/telegram-bot-api:ro
      - type: bind
        source: ${INPUT_HOST_DIR:-./input}
        target: /input
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 10s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Initialize only the new spool's root ownership, never persistent Bot API
  # state. Published multiarch app image provides Python; no source build.
  spool-init:
    profiles: [local-api]
    image: ${ARCHIVE_IMAGE:-ghcr.io/bscongluanbui/mycameratele:latest}
    pull_policy: missing
    user: "0:0"
    network_mode: none
    read_only: true
    restart: "no"
    entrypoint: [python, -c]
    command:
      - "import os, stat; p='/spool'; s=os.lstat(p); assert stat.S_ISDIR(s.st_mode); os.chown(p,10001,10001,follow_symlinks=False); os.chmod(p,0o700)"
    volumes:
      - bot-api-spool:/spool
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]

  # Local Bot API receives streamed multipart into a separate disk volume.
  # The 5 GB worker admission budget is cooperative, not a filesystem quota.
  telegram-bot-api:
    profiles: [local-api]
    image: ${BOT_API_IMAGE:-ghcr.io/bscongluanbui/mycameratele-bot-api:latest}
    pull_policy: missing
    init: true
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
    command:
      - --local
      - --http-port=8081
      - --dir=/var/lib/telegram-bot-api
      # Bot API owns live-file cleanup. Never put large uploads in RAM /tmp.
      - --temp-dir=/var/lib/telegram-bot-api-spool
    volumes:
      - bot-api-state:/var/lib/telegram-bot-api
      - bot-api-spool:/var/lib/telegram-bot-api-spool
    depends_on:
      spool-init:
        condition: service_completed_successfully
    expose:
      - "8081"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    healthcheck:
      test: [CMD, curl, --silent, --show-error, --max-time, "5", --output, /dev/null, "http://127.0.0.1:8081/"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  archive-state:
  archive-cache:
  bot-api-state:
  bot-api-spool:
