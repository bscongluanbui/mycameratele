name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Python application tests
        run: python -m unittest discover -s tests -v
      - name: Browser helper tests
        run: node archive_app/web/test_web.js
      - name: Python compilation and manifest validator tests
        run: |
          python -m compileall -q archive_app tests scripts
          python scripts/ci_validate_manifest.py --self-test
          python scripts/ci_validate_private_compose.py
      - name: Compose and multiarch configuration
        run: |
          docker compose config --quiet
          docker compose --profile local-api config --quiet
          docker buildx bake --print
