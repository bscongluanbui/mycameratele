name: Publish optional Bot API image

# The native C++ build is separate from the app publication and runs only on demand.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-bot-api-main
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'bscongluanbui/mycameratele' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Image metadata
        id: meta
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-bot-api" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Native pinned-source Bot API build and digest push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.bot-api
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: BUILD_JOBS=2
          cache-from: type=gha,scope=bot-api-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=bot-api-${{ matrix.arch }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=mycameratele-bot-api
      - name: Run native binary help and verify non-root UID
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            "$IMAGE@$DIGEST" --help > "$RUNNER_TEMP/bot-api-help.txt" 2>&1
          cat "$RUNNER_TEMP/bot-api-help.txt"
          uid="$(docker run --rm --read-only --entrypoint id "$IMAGE@$DIGEST" -u)"
          test "$uid" = 10001
          mkdir -p "$RUNNER_TEMP/digests"
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Export tested image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bot-api-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

  merge:
    needs: build
    if: github.repository == 'bscongluanbui/mycameratele' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: bot-api-digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge tested native images and verify the index
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}-bot-api"
          mapfile -t digests < <(find "$RUNNER_TEMP/digests" -maxdepth 1 -type f -printf '%f\n' | sort)
          test "${#digests[@]}" -eq 2
          sources=()
          for digest in "${digests[@]}"; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
            sources+=("$image@sha256:$digest")
          done
          docker buildx imagetools create --tag "$image:latest" --tag "$image:sha-$GITHUB_SHA" "${sources[@]}"
          docker buildx imagetools inspect --raw "$image:sha-$GITHUB_SHA" > "$RUNNER_TEMP/bot-api-manifest.json"
          python scripts/ci_validate_manifest.py "$RUNNER_TEMP/bot-api-manifest.json" linux/amd64 linux/arm64
          digest="$(docker buildx imagetools inspect "$image:sha-$GITHUB_SHA" --format '{{.Manifest.Digest}}')"
          {
            echo '## Published optional Bot API image'
            echo "- Latest: \`$image:latest\`"
            echo "- SHA tag: \`$image:sha-$GITHUB_SHA\`"
            echo "- Digest pull: \`docker pull $image@$digest\`"
            echo '- Native build/runtime checks: linux/amd64 and linux/arm64; ARMv7 is not published for this optional image.'
          } >> "$GITHUB_STEP_SUMMARY"
