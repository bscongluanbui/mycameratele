# Optional Local Bot API override. Keep the base project's existing volumes.
# Worker streams multipart bytes; the API does not read the archive cache.
# Usage: docker compose -f compose.yaml -f compose.local.yaml --profile local-api up -d
# Owner, bot token and application credentials must be supplied in the local .env.
services:
  archive:
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_OWNER_USER_ID: ${TELEGRAM_OWNER_USER_ID:?Set positive TELEGRAM_OWNER_USER_ID in .env}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_API_BASE: http://telegram-bot-api:8081
      TELEGRAM_API_MODE: local
      BOT_API_SPOOL_DIR: /var/lib/telegram-bot-api-spool
      BOT_API_SPOOL_MAX_GB: ${BOT_API_SPOOL_MAX_GB:-5}
      TELEGRAM_MAX_BYTES: "2000000000"
      KEEP_CACHE: "false"
      CACHE_RETENTION_HOURS: ${CACHE_RETENTION_HOURS:-0}
      ERROR_RETENTION_HOURS: ${ERROR_RETENTION_HOURS:-72}
      ENABLE_UPLOAD: ${ENABLE_UPLOAD:-false}
    depends_on:
      telegram-bot-api:
        condition: service_healthy

  dashboard:
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_OWNER_USER_ID: ${TELEGRAM_OWNER_USER_ID:?Set positive TELEGRAM_OWNER_USER_ID in .env}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_API_BASE: http://telegram-bot-api:8081
      TELEGRAM_API_MODE: local
      TELEGRAM_MAX_BYTES: "2000000000"
      KEEP_CACHE: "false"
      CACHE_RETENTION_HOURS: ${CACHE_RETENTION_HOURS:-0}
      ERROR_RETENTION_HOURS: ${ERROR_RETENTION_HOURS:-72}
      ENABLE_UPLOAD: ${ENABLE_UPLOAD:-false}

  telegram-bot-api:
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?Set TELEGRAM_API_ID in .env}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?Set TELEGRAM_API_HASH in .env}
